<!DOCTYPE html>
<html lang="en" data-theme="light ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo|login</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- tailwindcss + daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[300px] mx-auto pt-32">
        <img src="assets/Logo-full.png" alt="">
    </div>
    <div class="hero">
        <div class="hero-content pt-[32px] ">
            
            <div class="card bg-base-100 min-w-[370px] shrink-0 shadow-2xl rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label font-bold text-black">Mobile Number</label>
                        <input type="tel" id="input-number" class="input rounded-full outline-none border-hidden  bg-base-300" placeholder="Enter yourMobile Number" />
                        <label class="label font-bold text-black">4 Digit Pin</label>
                        <input type="password" id="input-pin" class="input rounded-full outline-none border-hidden bg-base-300" placeholder="Enter 4 Digit Pin" />
                        <button id="login-btn" class="btn btn-neutral mt-4 rounded-full bg-primary text-white">Login</button>
                    </fieldset>
                </div>
            </div>
        </div>
    </div>

    <script src="./Script/login.js"></script>
</body>

</html>
