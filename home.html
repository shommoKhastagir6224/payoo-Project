<!DOCTYPE html>
<html lang="en" data-theme="light ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo| Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- tailwindcss + daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="bg-base-300 shadow-md sticky top-0">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex items-center gap-2">
                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$ <span id="balance">85000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>
            <div class="right">
                <a href="index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
            </div>
        </section>
    </header>
    <section class="w-11/12 mx-auto py-10 space-y-5">
        <h2 class="font-bold text-3xl">Welcome to Pay<span class="text-[#7460ffFF]">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and</p>
        <div class="buttons grid grid-cols-3 gap-3">
            <button class="btn flex-col h-full py-5  btn-soft  ">
                <img src="./assets/opt-1.png" alt="">
                <p class="text-neutral/50 font-medium pt-2">Add money</p>
            </button>
            <button class="btn flex-col h-full py-5  btn-soft ">
                <img src="./assets/opt-2.png" alt="">
                <p class="text-neutral/50 font-medium pt-2">Cashout</p>
            </button>
            <button class="btn flex-col h-full py-5  btn-soft ">
                <img src="./assets/opt-3.png" alt="">
                <p class="text-neutral/50 font-medium pt-2">Transfer Money</p>
            </button>
            <button class="btn flex-col h-full py-5  btn-soft ">
                <img src="./assets/opt-4.png" alt="">
                <p class="text-neutral/50 font-medium pt-2">Get Bonus</p>
            </button>
            <button class="btn flex-col h-full py-5  btn-soft ">
                <img src="./assets/opt-5.png" alt="">
                <p class="text-neutral/50 font-medium pt-2">Pay Bill</p>
            </button>
            <button class="btn flex-col h-full py-5  btn-soft ">
                <img src="./assets/opt-6.png" alt="">
                <p class="text-neutral/50 font-medium pt-2">Transactions</p>
            </button>
        </div>
    </section>
    <section class="w-11/12 mx-auto py-5" id="cashout">
        <h2 class="text-2xl font-bold mb-5">Cashout</h2>
        <div class="card bg-base-100 min-w-[370px] mb-[120px] shadow-xl rounded-xl">
            <div class="card-body">
                <fieldset class="fieldset text-[16px] text-base">
                    <label class="label ">Agent Number</label>
                    <input type="tel" id="agent-number"
                        class="input rounded-full outline-none border-hidden  bg-base-300 w-full"
                        placeholder="Enter 11 digit Number" />
                    <label class="label  ">Amount </label>
                    <input type="number" id="input-amount"
                        class="input rounded-full outline-none border-hidden  bg-base-300 w-full"
                        placeholder="Enter amount to withdraw" />
                    <label class="label ">Pin Number</label>
                    <input type="password" id="input-pin"
                        class="input rounded-full outline-none border-hidden bg-base-300 w-full"
                        placeholder="Enter 4 Digit Pin number" />
                    <button id="cashout-btn"
                        class="btn btn-neutral mt-4 rounded-full bg-primary text-white border-none">Withdraw Money</button>
                </fieldset>
            </div>
        </div>
    </section>
    <script src="./Script/cashout.js"></script>
</body>

</html>
